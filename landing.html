<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useEffect } = React;

/* ---------- Brain map mock data ---------- */
/* Hex grid of receptor "cells" by region. Values: -3..+3 deviation from baseline. */
const REGIONS = [
  { id: 'OFC',     label: 'OFC',      col: 1, row: 0 },
  { id: 'ACC',     label: 'ACC',      col: 2, row: 0 },
  { id: 'dlPFC',   label: 'dlPFC',    col: 3, row: 0 },
  { id: 'vmPFC',   label: 'vmPFC',    col: 0, row: 1 },
  { id: 'Caudate', label: 'Caudate',  col: 1, row: 1 },
  { id: 'Putamen', label: 'Putamen',  col: 2, row: 1 },
  { id: 'vS',      label: 'vStriatum',col: 3, row: 1 },
  { id: 'Amyg',    label: 'Amygdala', col: 4, row: 1 },
  { id: 'Hipp',    label: 'Hipp.',    col: 0, row: 2 },
  { id: 'Raphe',   label: 'Raphe',    col: 1, row: 2 },
  { id: 'VTA',     label: 'VTA',      col: 2, row: 2 },
  { id: 'LC',      label: 'LC',       col: 3, row: 2 },
  { id: 'mPFC',    label: 'mPFC',     col: 4, row: 2 },
];

/* For the demo: each region has ~4 receptor cells. Layer values:
   "patient":   patient effective state vs baseline
   "rx":        coverage from chosen treatment
   "residual":  what remains after treatment
*/
const SYSTEMS = ['5HT', 'DA', 'Glu', 'GABA'];

/* deterministic-ish synthetic patient pattern that looks plausibly OCD */
function buildCells() {
  const out = [];
  REGIONS.forEach((r) => {
    SYSTEMS.forEach((s, i) => {
      // synthesize a pattern: OFC/Caudate/vS hyperactive serotonergic+gluta circuit
      let v = 0;
      if ((r.id === 'OFC' || r.id === 'ACC') && (s === '5HT' || s === 'Glu')) v = -2;
      if ((r.id === 'Caudate' || r.id === 'Putamen' || r.id === 'vS') && s === 'DA') v = +2;
      if (r.id === 'Raphe' && s === '5HT') v = -2;
      if (r.id === 'Amyg' && s === 'GABA') v = -1;
      if (r.id === 'dlPFC' && s === 'Glu') v = -1;
      if (r.id === 'mPFC' && s === '5HT') v = -1;
      if (r.id === 'Hipp' && s === 'GABA') v = +1;
      // small jitter for visual texture
      const jitter = ((r.col * 7 + r.row * 3 + i * 5) % 5) - 2;
      const patient = Math.max(-3, Math.min(3, v + (jitter > 1 ? 1 : jitter < -1 ? -1 : 0)));
      // sertraline-like coverage: nudges 5HT toward 0 in OFC/ACC/Raphe; partial Glu in OFC
      let rx = 0;
      if (s === '5HT' && (r.id === 'OFC' || r.id === 'ACC' || r.id === 'Raphe' || r.id === 'mPFC')) rx = patient < 0 ? -patient * 0.7 : 0;
      if (s === 'Glu' && (r.id === 'OFC')) rx = patient < 0 ? -patient * 0.4 : 0;
      const residual = +(patient + rx).toFixed(2);
      out.push({ region: r.id, system: s, patient, rx, residual });
    });
  });
  return out;
}

const CELLS = buildCells();

/* color encoding: red(-) -> neutral -> blue(+), like a heatmap diverging scale */
function colorFor(v) {
  // v in [-3, 3]
  const t = Math.max(-3, Math.min(3, v));
  if (Math.abs(t) < 0.2) return '#2a3454';
  // negative -> rose, positive -> azure; magnitude maps to opacity
  const mag = Math.min(1, Math.abs(t) / 3);
  if (t < 0) {
    const a = 0.25 + mag * 0.7;
    return `rgba(239, 111, 125, ${a.toFixed(2)})`;
  } else {
    const a = 0.25 + mag * 0.7;
    return `rgba(122, 168, 255, ${a.toFixed(2)})`;
  }
}

/* Compute hex polygon points for a flat-top hex */
function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const angle = (Math.PI / 3) * i;
    pts.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
  }
  return pts.join(' ');
}

function BrainMap({ layer, onCellClick }) {
  // 5 cols x 3 rows. Inside each region, a tiny 2x2 of receptor cells.
  const cellByRegion = useMemo(() => {
    const m = {};
    CELLS.forEach((c) => {
      m[c.region] = m[c.region] || [];
      m[c.region].push(c);
    });
    return m;
  }, []);

  const W = 720, H = 360;
  const cellsPerRow = 5;
  const rows = 3;
  const padX = 60, padY = 40;
  const stepX = (W - padX * 2) / (cellsPerRow - 1);
  const stepY = (H - padY * 2) / (rows - 1);
  const r = 38; // outer hex radius

  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto">
      <defs>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="rgba(245,184,107,0.18)" />
          <stop offset="100%" stopColor="rgba(245,184,107,0)" />
        </radialGradient>
      </defs>
      <rect x="0" y="0" width={W} height={H} fill="url(#glow)" />
      {REGIONS.map((reg) => {
        const cx = padX + reg.col * stepX;
        const cy = padY + reg.row * stepY;
        const cells = cellByRegion[reg.id] || [];
        return (
          <g key={reg.id} className="hex">
            {/* Outer hex outline as a region container */}
            <polygon
              points={hexPoints(cx, cy, r)}
              fill="rgba(255,255,255,0.02)"
              stroke="#2a324b"
              strokeWidth="1"
            />
            {/* inner 4 small hexes for each receptor system */}
            {cells.map((c, idx) => {
              const dx = (idx % 2 === 0 ? -12 : 12);
              const dy = (idx < 2 ? -12 : 12);
              const v =
                layer === 'patient' ? c.patient :
                layer === 'rx' ? -c.rx :    // show coverage as inverse direction
                layer === 'residual' ? c.residual :
                c.patient;
              return (
                <polygon
                  key={c.system}
                  points={hexPoints(cx + dx, cy + dy, 10)}
                  fill={colorFor(v)}
                  stroke="#0a0e1a"
                  strokeWidth="1.5"
                  onClick={() => onCellClick && onCellClick(c)}
                >
                  <title>{`${reg.label} · ${c.system}: ${v.toFixed(2)}`}</title>
                </polygon>
              );
            })}
            {/* region label */}
            <text x={cx} y={cy + r + 14} textAnchor="middle" fontSize="10" fill="#8390aa" fontFamily="Inter">
              {reg.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
}

function ScribeMock() {
  const items = [
    {
      qid: 'p1',
      proposal: 'Doubt-spectrum subsystem · +1 (worsening)',
      quote: '"...checking the lock six, seven times now, even after I know I locked it."',
      conf: 0.86,
    },
    {
      qid: 'p2',
      proposal: 'Habit-spectrum subsystem · +1',
      quote: '"It\'s automatic — I don\'t even decide to do it anymore."',
      conf: 0.81,
    },
    {
      qid: 'p3',
      proposal: 'Family history TS → CIN density (Caudate) · -1',
      quote: '"...my brother had tics as a kid, never diagnosed but obvious."',
      conf: 0.74,
    },
  ];
  const [state, setState] = useState({});
  const set = (id, v) => setState((s) => ({ ...s, [id]: v }));
  return (
    <div className="panel rounded-xl">
      <div className="flex items-center justify-between px-4 py-3 border-b hairline">
        <div className="flex items-center gap-2 text-xs ink-soft">
          <span className="w-2 h-2 rounded-full bg-[var(--teal)] animate-pulse"></span>
          Visit 0:42:17 · transcript captured
        </div>
        <div className="text-xs ink-dim">3 proposals pending review</div>
      </div>
      <div className="divide-y" style={{borderColor:'var(--line)'}}>
        {items.map((p) => {
          const s = state[p.qid];
          return (
            <div key={p.qid} className="p-4">
              <div className="flex items-start justify-between gap-4">
                <div>
                  <div className="text-sm">{p.proposal}</div>
                  <div className="text-xs ink-dim mt-1">{p.quote}</div>
                  <div className="text-[11px] ink-dim mt-2">confidence {p.conf.toFixed(2)}</div>
                </div>
                <div className="flex gap-2 shrink-0">
                  {!s && (
                    <>
                      <button onClick={() => set(p.qid,'approved')} className="text-xs px-3 py-1 rounded-md" style={{background:'#214f3e', color:'#cbe9d9'}}>Approve</button>
                      <button onClick={() => set(p.qid,'edited')} className="text-xs px-3 py-1 rounded-md btn-ghost">Edit</button>
                      <button onClick={() => set(p.qid,'rejected')} className="text-xs px-3 py-1 rounded-md" style={{background:'#3b1f25', color:'#f4c0c6'}}>Reject</button>
                    </>
                  )}
                  {s && (
                    <span className="text-xs px-3 py-1 rounded-md" style={{
                      background: s==='approved'?'#214f3e':s==='rejected'?'#3b1f25':'#3a3424',
                      color: s==='approved'?'#cbe9d9':s==='rejected'?'#f4c0c6':'#f5dca0'
                    }}>{s}</span>
                  )}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="px-4 py-3 border-t hairline text-xs ink-dim flex items-center justify-between">
        <span>All proposals link to a substring of the verbatim transcript.</span>
        <span className="accent">Audit logged</span>
      </div>
    </div>
  );
}

        v1 covers Y-BOCS, PHQ-9, GAD-7, and MADRS, with three disorder templates and ten first-line drug
        coverage profiles: sertraline, fluoxetine, escitalopram, venlafaxine, duloxetine, bupropion,
        lamotrigine, aripiprazole, clonidine, NAC.

}

/* Waitlist form */
function Waitlist() {
  const [form, setForm] = useState({ name: '', email: '', practice: '', volume: '50–150', interests: [] });
  const [status, setStatus] = useState('idle');

  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const toggle = (val) =>
    setForm((f) => ({
      ...f,
      interests: f.interests.includes(val) ? f.interests.filter((x) => x !== val) : [...f.interests, val],
    }));

  const submit = (e) => {
    e.preventDefault();
    if (!form.email || !form.name) {
      setStatus('error');
      return;
    }
    // mailto fallback so this works without backend wiring yet
    const body = encodeURIComponent(
      `Name: ${form.name}\nEmail: ${form.email}\nPractice: ${form.practice}\nMonthly visits: ${form.volume}\nInterests: ${form.interests.join(', ')}`
    );
    const subject = encodeURIComponent('Auria pilot — application');
    window.location.href = `mailto:rivyyriv@gmail.com?subject=${subject}&body=${body}`;
    setStatus('sent');
  };

  return (
    <section id="waitlist" className="max-w-6xl mx-auto px-6 py-20">
      <div className="grid md:grid-cols-12 gap-10 items-start">
        <div className="md:col-span-5">
          <div className="text-xs uppercase tracking-widest accent mb-3">Apply</div>
          <h2 className="font-display text-3xl md:text-4xl leading-tight mb-4">Join the pilot.</h2>
          <p className="ink-soft mb-3">We're inviting one to three solo or small-clinic prescribers into the v1 pilot. Tell us a little about your practice and we'll be in touch within a week.</p>
          <p className="ink-dim text-xs">We don't share your information. The pilot is bound by a mutual NDA and BAA.</p>
        </div>
        <div className="md:col-span-7">
          <form onSubmit={submit} className="panel rounded-xl p-6 space-y-4">
            <div className="grid sm:grid-cols-2 gap-4">
              <label className="text-xs ink-soft block">
                Your name
                <input value={form.name} onChange={(e)=>set('name',e.target.value)} required type="text" className="mt-1 w-full bg-[var(--bg-soft)] border hairline rounded-md px-3 py-2 text-sm text-white" placeholder="Dr. Jane Doe" />
              </label>
              <label className="text-xs ink-soft block">
                Email
                <input value={form.email} onChange={(e)=>set('email',e.target.value)} required type="email" className="mt-1 w-full bg-[var(--bg-soft)] border hairline rounded-md px-3 py-2 text-sm text-white" placeholder="you@clinic.com" />
              </label>
            </div>
            <label className="text-xs ink-soft block">
              Practice
              <input value={form.practice} onChange={(e)=>set('practice',e.target.value)} type="text" className="mt-1 w-full bg-[var(--bg-soft)] border hairline rounded-md px-3 py-2 text-sm text-white" placeholder="Solo outpatient psychiatry, Brooklyn NY" />
            </label>
            <label className="text-xs ink-soft block">
              Monthly outpatient visits
              <select value={form.volume} onChange={(e)=>set('volume',e.target.value)} className="mt-1 w-full bg-[var(--bg-soft)] border hairline rounded-md px-3 py-2 text-sm text-white">
                <option>&lt; 50</option>
                <option>50–150</option>
                <option>150–300</option>
                <option>300+</option>
              </select>
            </label>
            <fieldset className="text-xs ink-soft">
              <div className="mb-2">What interests you most? (pick any)</div>
              <div className="flex flex-wrap gap-2">
                {['Brain map / mechanism', 'AI scribe', 'Predicted-vs-observed loop', 'Patient-facing summary'].map((tag) => (
                  <button key={tag} type="button" onClick={()=>toggle(tag)} className={`text-xs px-3 py-1.5 rounded-full border ${form.interests.includes(tag)?'border-[var(--accent)] text-[var(--accent)] bg-[var(--accent-soft)]':'hairline ink-soft'}`}>
                    {tag}
                  </button>
                ))}
              </div>
            </fieldset>
            <div className="flex items-center justify-between pt-2">
              <div className="text-xs ink-dim">
                {status === 'error' && <span className="text-[var(--rose)]">Name and email are required.</span>}
                {status === 'sent' && <span className="text-[var(--teal)]">Thanks — your mail client should have opened.</span>}
              </div>
              <button type="submit" className="btn-primary px-5 py-2.5 rounded-md text-sm">Apply for the pilot →</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  );
}
